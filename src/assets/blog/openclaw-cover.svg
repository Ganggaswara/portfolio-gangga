<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Diagram OpenClaw: gateway mandiri yang menghubungkan aplikasi chat dengan agen AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010736"/>
      <stop offset="0.55" stop-color="#0d1c42"/>
      <stop offset="1" stop-color="#010736"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fcf1d0" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#5c78c4" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#010736" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcf1d0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fcf1d0" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fcf1d0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" fill="#fcf1d0">
    <text x="64" y="76" font-size="15" letter-spacing="6" opacity="0.55">02 / GATEWAY MANDIRI</text>
    <text x="64" y="620" font-size="13" letter-spacing="4" opacity="0.4">CHAT APPS / ONE GATEWAY / AI AGENTS</text>
  </g>

  <g stroke="url(#wire)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M330 214 C430 214 440 300 510 300"/>
    <path d="M330 337 L510 337"/>
    <path d="M330 460 C430 460 440 374 510 374"/>
    <path d="M690 300 C760 300 770 214 870 214"/>
    <path d="M690 337 L870 337"/>
    <path d="M690 374 C760 374 770 460 870 460"/>
  </g>

  <g fill="#fcf1d0" opacity="0.8">
    <circle cx="435" cy="272" r="3"/>
    <circle cx="435" cy="402" r="3"/>
    <circle cx="765" cy="272" r="3"/>
    <circle cx="765" cy="402" r="3"/>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#c9d3e8">
    <g>
      <rect x="130" y="188" width="200" height="52" rx="26" fill="#0d1c42" stroke="#fcf1d0" stroke-opacity="0.25"/>
      <text x="230" y="221" text-anchor="middle" fill="#e8eefb">WHATSAPP</text>
      <rect x="130" y="311" width="200" height="52" rx="26" fill="#0d1c42" stroke="#fcf1d0" stroke-opacity="0.25"/>
      <text x="230" y="344" text-anchor="middle" fill="#e8eefb">TELEGRAM</text>
      <rect x="130" y="434" width="200" height="52" rx="26" fill="#0d1c42" stroke="#fcf1d0" stroke-opacity="0.25"/>
      <text x="230" y="467" text-anchor="middle" fill="#e8eefb">DISCORD</text>
    </g>
    <g>
      <rect x="870" y="188" width="200" height="52" rx="26" fill="#0d1c42" stroke="#fcf1d0" stroke-opacity="0.25"/>
      <text x="970" y="221" text-anchor="middle" fill="#e8eefb">AGENT</text>
      <rect x="870" y="311" width="200" height="52" rx="26" fill="#0d1c42" stroke="#fcf1d0" stroke-opacity="0.25"/>
      <text x="970" y="344" text-anchor="middle" fill="#e8eefb">TOOLS</text>
      <rect x="870" y="434" width="200" height="52" rx="26" fill="#0d1c42" stroke="#fcf1d0" stroke-opacity="0.25"/>
      <text x="970" y="467" text-anchor="middle" fill="#e8eefb">WORKSPACE</text>
    </g>
  </g>

  <g>
    <rect x="510" y="277" width="180" height="120" rx="24" fill="#22396f" stroke="#fcf1d0" stroke-opacity="0.55"/>
    <rect x="523" y="290" width="154" height="94" rx="17" fill="none" stroke="#fcf1d0" stroke-opacity="0.18"/>
    <text x="600" y="330" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" letter-spacing="3" fill="#fcf1d0">OPENCLAW</text>
    <text x="600" y="356" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2.2" fill="#9fb4dc">SELF-HOSTED</text>
    <text x="600" y="371" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2.2" fill="#9fb4dc">GATEWAY</text>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" fill="#9fb4dc" font-size="12" letter-spacing="1.6">
    <text x="420" y="170" text-anchor="middle">channels</text>
    <text x="780" y="170" text-anchor="middle">sessions</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#fcf1d0" stroke-opacity="0.12"/>
</svg>
